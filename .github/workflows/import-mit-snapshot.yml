name: Import exact Odysseus MIT snapshot
on:
  push:
    paths:
      - '.github/workflows/import-mit-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and verify pinned MIT source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/arcahyadi/odysseus.git /tmp/odysseus-source
          git -C /tmp/odysseus-source checkout --detach d397b3db2f93d36068a96e9524f8b6bfa4f09f0e
          test "$(git -C /tmp/odysseus-source rev-parse HEAD)" = "d397b3db2f93d36068a96e9524f8b6bfa4f09f0e"
          test "$(git -C /tmp/odysseus-source rev-parse HEAD^{tree})" = "d7d1143ee58beaf6889d22ec70bbf6edbc41163a"
          grep -qx 'MIT License' /tmp/odysseus-source/LICENSE
      - name: Copy source snapshot to destination
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/odysseus-source/ "$GITHUB_WORKSPACE/"
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import pinned Odysseus MIT snapshot d397b3db2f93'
          git push origin HEAD:main
